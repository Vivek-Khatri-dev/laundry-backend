spring.application.name=laundry-backend

# ── MySQL (Using Environment Variables) ──────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - SIMPLIFIED
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:28800000}

# ── Server ─────────────────────────────────────────────
server.port=${PORT:8080}
server.tomcat.threads.max=10
server.tomcat.max-connections=20

# ── CORS ──────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}

# ── Company Details ──────────────────────────────────
app.company.name=Dawson's Laundry
app.company.address=Jail Road, Hyderabad
app.company.phone=+92 3315850442

# ── Date/Time ────────────────────────────────────────
spring.jackson.time-zone=Asia/Karachi
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# ── Email ─────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.from=${MAIL_USERNAME}
app.email.enabled=${EMAIL_ENABLED:true}

# ── SAP ─────────────────────────────────────────────────
sap.b1.enabled=${SAP_ENABLED:false}
sap.api.enabled=${SAP_API_ENABLED:false}
sap.api.keys=${SAP_API_KEYS:laundry-sap-key-123}

# ── Twilio ────────────────────────────────────────────
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}

# ── Ollama AI ─────────────────────────────────────────
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}

# ── Logging (Reduce output) ──────────────────────────
logging.level.root=WARN
logging.level.com.dawsons.laundry=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n