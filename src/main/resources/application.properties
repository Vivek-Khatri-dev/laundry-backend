spring.application.name=laundry-backend

# ── MySQL (Using Environment Variables) ──────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dawsons_laundry?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:CHANGE_ME_to_a_long_random_secret_at_least_32_bytes_______}
app.jwt.expiration-ms=${JWT_EXPIRATION:28800000}

# ── Server ─────────────────────────────────────────────
server.port=${PORT:8080}

# ── CORS ──────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500}

# ── Timeouts ──────────────────────────────────────────
server.servlet.session.timeout=30m
server.tomcat.connection-timeout=60000
server.tomcat.max-http-form-post-size=100MB
spring.mvc.async.request-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10

# ── Company Details ──────────────────────────────────
app.company.name=Dawson's Laundry
app.company.address=Jail Road, Hyderabad
app.company.phone=+92 3315850442

# ── Date/Time ────────────────────────────────────────
spring.jackson.time-zone=Asia/Karachi
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# ── Email (Environment Variables) ────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.from=${MAIL_USERNAME:}
app.email.enabled=${EMAIL_ENABLED:true}
app.email.order-confirmation.subject=Order Confirmation - Dawson's Laundry
app.email.ready.subject=Your Order is Ready for Collection - Dawson's Laundry
app.email.payment-confirmation.subject=Payment Confirmation - Dawson's Laundry

# ── SAP Business One ──────────────────────────────────
sap.b1.enabled=${SAP_ENABLED:false}
sap.b1.base-url=${SAP_BASE_URL:https://CHANGE_ME:50000/b1s/v1}
sap.b1.company-db=${SAP_COMPANY_DB:CHANGE_ME}
sap.b1.username=${SAP_USERNAME:CHANGE_ME}
sap.b1.password=${SAP_PASSWORD:CHANGE_ME}

# ── SAP API Keys ──────────────────────────────────────
sap.api.enabled=${SAP_API_ENABLED:true}
sap.api.keys=${SAP_API_KEYS:laundry-sap-key-123}

# ── Twilio ────────────────────────────────────────────
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}

# ── Ollama AI ─────────────────────────────────────────
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}